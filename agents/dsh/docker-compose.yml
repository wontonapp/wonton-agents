# 本文件由 gen/gen.py 从 agent.yaml 和 template/ 生成：改 agent.yaml 后重新生成，不要手改。
# bridge 说 ACP、不认识任何一家 Agent；两个服务共享 ACP socket 所在的 run/ 子目录和工作区（bridge 把主人发来的
# 图片和文件落到工作区的 wonton-attachments/ 下，再把路径交给 Agent）。bridge 的 crypto store 和 Matrix 令牌不给
# agent，agent 的 HOME 不给 bridge。
services:
  agent:
    image: ghcr.io/wontonapp/wonton-agents/dsh:0.1.5@sha256:ed6e7d224abba8229af4e5938a274c06c33939fa99ac51beaa3b296b5c2f9c36
    # 底座镜像固定用 65532，入口不再降权；bridge 挂同一个 run/ 目录，两个服务的属主必须相同。
    user: "65532:65532"
    restart: unless-stopped
    environment:
      HOME: /data/agent/home
      # 底座每次启动按有没有值选路：三个 WONTON_MODEL_* 都有值时调网关钩子，任一为空就清掉
      # 网关配置、用 Agent 自己的登录态。这里不写代理变量，写了空值会把核心注入的顶掉。
      WONTON_MODEL_BASE_URL: ${WONTON_MODEL_BASE_URL:-}
      WONTON_MODEL_API_KEY: ${WONTON_MODEL_API_KEY:-}
      WONTON_MODEL_DEFAULT: ${WONTON_MODEL_DEFAULT:-}
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      # 容器里没有浏览器：登录命令只打链接，用户自己开浏览器拿 code。
      NO_BROWSER: "1"
      DSH_HOME: /data/agent/home/.dsh
      DSH_TELEMETRY_MODE: DISABLED
      WONTON_MCP_URL: ${WONTON_MCP_URL:?需要 MCP 总线地址}
    volumes:
      - ${WONTON_BOT_DATA:?需要 Bot 数据目录}/agent:/data/agent
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      # socket 是就绪的标志（首启下载 CLI 可能要几分钟）：有它才算能接连接。
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      start_interval: 2s

  bridge:
    # 桥镜像的版本和摘要只写这一处；桥升级改这里，再重新生成所有子目录。
    image: ghcr.io/wontonapp/wonton-acp-bridge:main-c69aebc@sha256:ce235c94454fdad3fbac729db5d21a8bcdec88688f43e6cd9aebe9efbac2c85d
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_started
    environment:
      HOME: /data/bridge
      WONTON_BOT_DATA: /data
      WONTON_BRIDGE_DATA: /data/bridge
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      WONTON_MATRIX_HOMESERVER: ${WONTON_MATRIX_HOMESERVER:?需要 Matrix 地址}
      WONTON_MATRIX_ACCESS_TOKEN: ${WONTON_MATRIX_ACCESS_TOKEN:?需要 Bot 的 Matrix 访问令牌}
      # 名单变量 0.9 起改叫 WONTON_MATRIX_ALLOWED_USERS；两个名字都传，新旧桥都能读。
      WONTON_MATRIX_ALLOWED_USERS: ${WONTON_MATRIX_ALLOWED_USERS:-${WONTON_MATRIX_OWNER:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_OWNER: ${WONTON_MATRIX_OWNER:-${WONTON_MATRIX_ALLOWED_USERS:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_HOME_ROOM: ${WONTON_MATRIX_HOME_ROOM:?需要主人与 Bot 的主房间}
      WONTON_MCP_URL: ${WONTON_MCP_URL:?需要 MCP 总线地址}
      # 主会话的 ACP 模式；话题会话要更严的「改前先问」模式时，在 agent.yaml 配 acp_topic_mode。
      WONTON_ACP_MODE: default
    volumes:
      - ${WONTON_BOT_DATA}/bridge:/data/bridge
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
x-wonton:
  spec: "0.6"
  id: ai.deepseek.dsh
  version: 0.1.5
  kind: agent
  title: { zh: dsh, en: dsh }
  description:
    zh: DeepSeek 的编程 Agent（dsh），在聊天里写代码、跑命令
    en: DeepSeek's coding agent (dsh) that writes code and runs commands in chat
  icon: icon.svg
  notices: [NOTICE, image/LICENSE.dsh]
  author: { name: Wonton plugin authors }
  homepage: https://github.com/deepseek-ai/deepseek-harness
  license: MIT
  tags: { zh: [AI, 开发], en: [AI, Development] }
  about:
    zh: |
      DeepSeek 的 dsh 以 Bot 的身份住进聊天：模型只通过 magpie 模型网关，不用在插件里填 key。
      它住在自己的容器里，在 /workspace 工作区写代码、跑命令，改工作区之外的文件或出网先经确认卡片问你；
      Wonton 插件的工具也从聊天里调。网关未就绪时如实报错，不会改用官方服务或已保存的 key。
      上游内置的 DeepSeek 模型搜索接口不支持此网关协议，因此不启用；网页读取和 MCP 工具保持可用。
    en: |
      DeepSeek's dsh lives in the chat as a bot, using models only through the magpie model gateway.
      No key is entered in the plugin. It works in its own container, coding and running commands in
      /workspace, and asks through confirmation cards before touching files outside it or reaching the
      network; Wonton plugin tools are called from the chat too. An unavailable gateway produces an
      explicit error, never a switch to official services or saved keys. The built-in DeepSeek model-backed
      search does not support the gateway protocol and is disabled; web fetching and MCP tools remain available.
  release_notes:
    zh: 更新底座到 0.1.2，修复模型来源模块缺失导致的启动错误；网关未就绪时明确报错，不会改连其他服务。
    en: Updates the base image to 0.1.2, fixing startup when the model-source module is missing; an unavailable gateway reports an error instead of switching services.
    zh-Hant: 更新底座至 0.1.2，修復模型來源模組缺失造成的啟動錯誤；網關未就緒時明確報錯，不會改連其他服務。
    ja: ベースイメージを 0.1.2 に更新し、モデルソースモジュール不足による起動エラーを修正しました。ゲートウェイ未準備時はエラーを示し、別サービスに切り替えません。
  agent:
    protocol: acp
  bot:
    display_name: { zh: dsh, en: dsh }
  bots:
    services: [agent, bridge]
  permissions:
    - matrix.bot
    - tools
    - models
    # 登录和官方模型请求都要出网；底座首启下载闭源 CLI 也走这里。
    - network.egress
  requirements:
    arch: [amd64, arm64]
    memory: 1G
