id: ai.deepseek.dsh
version: 0.1.6
title: { zh: dsh, en: dsh }
description:
  zh: DeepSeek 的编程 Agent（dsh），在聊天里写代码、跑命令
  en: DeepSeek's coding agent (dsh) that writes code and runs commands in chat
about:
  zh: |
    DeepSeek 的 dsh 以 Bot 的身份住进聊天：模型只通过 magpie 模型网关，不用在插件里填 key。
    它住在自己的容器里，在 /workspace 工作区写代码、跑命令，改工作区之外的文件或出网先经确认卡片问你；
    Wonton 插件的工具也从聊天里调。网关未就绪时如实报错，不会改用官方服务或已保存的 key。
    上游内置的 DeepSeek 模型搜索接口不支持此网关协议，因此不启用；网页读取和 MCP 工具保持可用。
  en: |
    DeepSeek's dsh lives in the chat as a bot, using models only through the magpie model gateway.
    No key is entered in the plugin. It works in its own container, coding and running commands in
    /workspace, and asks through confirmation cards before touching files outside it or reaching the
    network; Wonton plugin tools are called from the chat too. An unavailable gateway produces an
    explicit error, never a switch to official services or saved keys. The built-in DeepSeek model-backed
    search does not support the gateway protocol and is disabled; web fetching and MCP tools remain available.
release_notes:
  zh: 更新 ACP bridge 到包含旁聊修复的版本，修复旁聊消息被误判为不支持输入的问题。
  en: Updates the ACP bridge to include the topic-chat fix, preventing topic messages from being misclassified as unsupported input.
  zh-Hant: 更新 ACP bridge 至包含旁聊修復的版本，修復旁聊訊息被誤判為不支援輸入的問題。
  ja: ACP bridge を話題チャット修正を含む版に更新し、話題メッセージが入力非対応と誤判定される問題を修正しました。
license: MIT
notices: [NOTICE, image/LICENSE.dsh]
homepage: https://github.com/deepseek-ai/deepseek-harness
tags: { zh: [AI, 开发], en: [AI, Development] }
acp_mode: default
memory: 1G
env:
  # 会话和 acp profile 补丁保存在数据卷 HOME 下的 .dsh/。
  DSH_HOME: /data/agent/home/.dsh
  # 官方路由默认随请求回传会话日志和 OTLP 遥测；家里自用，全关。
  DSH_TELEMETRY_MODE: DISABLED
  WONTON_MCP_URL: ${WONTON_MCP_URL:?需要 MCP 总线地址}
