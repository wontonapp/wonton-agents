# omp 的配置：子镜像的全部差异就是这份文件、网关钩子和 Dockerfile COPY 进来的东西。
# omp 是开源 CLI（MIT），官方二进制已打进镜像，不需要 [install]。
[acp]
command = ["/usr/local/bin/omp", "acp"]

[skills]
target = "~/.agents/skills"

[gateway]
hook = "/usr/local/lib/wonton-agent/gateway"

[gateway.env]
LITELLM_API_KEY = "WONTON_MODEL_API_KEY"

# Use pinned upstream provider arguments, never the unrestricted provider picker.
# Device-code, polling and manual-only flows do not require a container callback.
[[login]]
id = "openai-codex-device"
name = "ChatGPT 订阅登录"
model_source = "official"
command = ["/usr/local/bin/omp", "login", "openai-codex-device"]

[[login]]
id = "github-copilot"
name = "GitHub Copilot 订阅登录"
model_source = "official"
command = ["/usr/local/bin/omp", "login", "github-copilot"]

