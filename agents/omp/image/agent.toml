# omp 的配置：子镜像的全部差异就是这份文件、网关钩子和 Dockerfile COPY 进来的东西。
# omp 是开源 CLI（MIT），官方二进制已打进镜像，不需要 [install]。
[acp]
command = ["/usr/local/bin/omp", "acp"]

[skills]
target = "~/.agents/skills"

[gateway]
hook = "/usr/local/lib/wonton-agent/gateway"

# omp 只有一种终端登录：它的默认形态是全屏 TUI，行式转发跑不起来；omp login 是同一套官方
# 登录的行式形态（选 provider、打印链接、收授权码和 key 都走 stdout/stdin），在聊天里
# 完成。凭据写进 HOME 下的 agent.db，容器重建后还在。
[[login]]
id = "terminal"
name = "模型账号登录"
command = ["/usr/local/bin/omp", "login"]
