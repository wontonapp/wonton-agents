# 本文件由 gen/gen.py 从 agent.yaml 和 template/ 生成：改 agent.yaml 后重新生成，不要手改。
# bridge 说 ACP、不认识任何一家 Agent；两个服务共享 ACP socket 所在的 run/ 子目录和工作区（bridge 把主人发来的
# 图片和文件落到工作区的 wonton-attachments/ 下，再把路径交给 Agent）。bridge 的 crypto store 和 Matrix 令牌不给
# agent，agent 的 HOME 不给 bridge。
services:
  agent:
    image: ghcr.io/wontonapp/wonton-agents/omp:0.1.7@sha256:387695c05f608454adb84a1cc1b3f22920563c0951a73aac4aae6c02c3b93135
    # 底座镜像固定用 65532，入口不再降权；bridge 挂同一个 run/ 目录，两个服务的属主必须相同。
    user: "65532:65532"
    restart: unless-stopped
    environment:
      HOME: /data/agent/home
      # 底座每次启动按有没有值选路：三个 WONTON_MODEL_* 都有值时调网关钩子，任一为空就清掉
      # 网关配置、用 Agent 自己的登录态。这里不写代理变量，写了空值会把核心注入的顶掉。
      WONTON_MODEL_BASE_URL: ${WONTON_MODEL_BASE_URL:-}
      WONTON_MODEL_API_KEY: ${WONTON_MODEL_API_KEY:-}
      WONTON_MODEL_DEFAULT: ${WONTON_MODEL_DEFAULT:-}
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      # 容器里没有浏览器：登录命令只打链接，用户自己开浏览器拿 code。
      NO_BROWSER: "1"
    volumes:
      - ${WONTON_BOT_DATA:?需要 Bot 数据目录}/agent:/data/agent
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      # socket 是就绪的标志（首启下载 CLI 可能要几分钟）：有它才算能接连接。
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      start_interval: 2s

  bridge:
    # 桥镜像的版本和摘要只写这一处；桥升级改这里，再重新生成所有子目录。
    image: ghcr.io/wontonapp/wonton-acp-bridge:main-c69aebc@sha256:ce235c94454fdad3fbac729db5d21a8bcdec88688f43e6cd9aebe9efbac2c85d
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_started
    environment:
      HOME: /data/bridge
      WONTON_BOT_DATA: /data
      WONTON_BRIDGE_DATA: /data/bridge
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      WONTON_MATRIX_HOMESERVER: ${WONTON_MATRIX_HOMESERVER:?需要 Matrix 地址}
      WONTON_MATRIX_ACCESS_TOKEN: ${WONTON_MATRIX_ACCESS_TOKEN:?需要 Bot 的 Matrix 访问令牌}
      # 名单变量 0.9 起改叫 WONTON_MATRIX_ALLOWED_USERS；两个名字都传，新旧桥都能读。
      WONTON_MATRIX_ALLOWED_USERS: ${WONTON_MATRIX_ALLOWED_USERS:-${WONTON_MATRIX_OWNER:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_OWNER: ${WONTON_MATRIX_OWNER:-${WONTON_MATRIX_ALLOWED_USERS:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_HOME_ROOM: ${WONTON_MATRIX_HOME_ROOM:?需要主人与 Bot 的主房间}
      WONTON_MCP_URL: ${WONTON_MCP_URL:?需要 MCP 总线地址}
      # 主会话的 ACP 模式；话题会话要更严的「改前先问」模式时，在 agent.yaml 配 acp_topic_mode。
      WONTON_ACP_MODE: plan
    volumes:
      - ${WONTON_BOT_DATA}/bridge:/data/bridge
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
x-wonton:
  spec: "0.6"
  id: ai.omp.agent
  version: 0.1.7
  kind: agent
  title: { zh: AI 编程助手（omp）, en: Coding Bot (omp) }
  description:
    zh: 自带工具的编程助手：先列计划，跑命令前弹卡片确认。默认使用 magpie 模型网关，也能明确选择受支持的官方订阅登录。
    en: "A coding bot with built-in tools: it plans first and asks before running commands. Uses magpie by default, with explicit supported official subscription sign-in."
  icon: icon.svg
  notices: [NOTICE, image/LICENSE.omp]
  author: { name: Wonton plugin authors }
  homepage: https://omp.sh
  license: MIT
  tags: { zh: [AI, 开发], en: [AI, Development] }
  about:
    zh: |
      omp 是一个编程 AI，住进你的聊天里。默认使用 magpie 模型网关；网关未就绪时会明确报错，不会改用其他来源。
      在聊天里发 /wonton login，可明确选择 ChatGPT、GitHub Copilot、Kimi Code、GitLab Duo、Factory Droid、
      Muse Code、Grok、Cursor 或 Perplexity 的官方订阅登录，或切回 magpie。不提供自填模型 key 或地址的入口。

      会话按 plan 模式跑：动工作区之前先出计划，跑命令前经确认卡片问你；Wonton 插件的工具从聊天里调。
      和它的对话是核心建的加密私聊，重启后接着聊。
    en: |
      omp is a coding AI living in your chat. It uses magpie by default and reports an unready gateway
      instead of switching sources. Send /wonton login to explicitly select an official ChatGPT,
      GitHub Copilot, Kimi Code, GitLab Duo, Factory Droid, Muse Code, Grok, Cursor or Perplexity subscription,
      or switch back to magpie. There is no model API-key or custom-endpoint login entry.

      Sessions run in plan mode: it drafts a plan before touching the workspace and asks through confirmation
      cards before running commands; Wonton plugin tools are called from the chat.
      The chat is an encrypted direct message the core creates, and it carries on after a restart.
  release_notes:
    zh: 更新底座到 0.1.2，修复模型来源模块缺失导致的启动错误；模型未就绪时明确提示，不会改用其他来源。
    en: Updates the base image to 0.1.2, fixing startup when the model-source module is missing; an unready model reports clearly without switching sources.
    zh-Hant: 更新底座至 0.1.2，修復模型來源模組缺失造成的啟動錯誤；模型未就緒時明確提示，不會改用其他來源。
    ja: ベースイメージを 0.1.2 に更新し、モデルソースモジュール不足による起動エラーを修正しました。モデル未準備時は明示的に通知し、別の接続先に切り替えません。
  agent:
    protocol: acp
    login:
      - id: openai-codex-device
        title: { zh: ChatGPT 订阅登录, en: ChatGPT subscription sign-in }
      - id: github-copilot
        title: { zh: GitHub Copilot 订阅登录, en: GitHub Copilot subscription sign-in }
      - id: kimi-code
        title: { zh: Kimi Code 订阅登录, en: Kimi Code subscription sign-in }
      - id: gitlab-duo-agent
        title: { zh: GitLab Duo 订阅登录, en: GitLab Duo subscription sign-in }
      - id: factory-droid
        title: { zh: Factory Droid 订阅登录, en: Factory Droid subscription sign-in }
      - id: muse-code
        title: { zh: Muse Code 订阅登录, en: Muse Code subscription sign-in }
      - id: xai-oauth
        title: { zh: Grok 订阅登录, en: Grok subscription sign-in }
      - id: cursor
        title: { zh: Cursor 订阅登录, en: Cursor subscription sign-in }
      - id: perplexity
        title: { zh: Perplexity 订阅登录, en: Perplexity subscription sign-in }
      - id: magpie
        title: { zh: magpie 模型网关, en: magpie model gateway }
  bot:
    display_name: { zh: AI 编程助手（omp）, en: Coding Bot (omp) }
  bots:
    services: [agent, bridge]
  permissions:
    - matrix.bot
    - tools
    - models
    # 登录和官方模型请求都要出网；底座首启下载闭源 CLI 也走这里。
    - network.egress
  requirements:
    arch: [amd64, arm64]
    memory: 1G
