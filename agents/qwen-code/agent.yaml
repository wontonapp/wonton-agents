id: ai.qwen-code
version: 0.1.5
title: { zh: AI 编程助手（Qwen Code）, en: Coding Bot (Qwen Code) }
description:
  zh: 阿里巴巴（通义千问）家的编程助手：通过 magpie 模型网关，在聊天里帮你写代码、改文件、跑命令，动手前先弹卡片问你。
  en: "Alibaba's Qwen coding bot: uses the magpie model gateway to write code, edit files and run commands from your chat, asking with a card before it acts."
about:
  zh: |
    Qwen Code 是阿里巴巴家的编程 AI，住进你的聊天里。模型统一通过 magpie 模型网关，
    不用在插件里填 key。网关未就绪时明确报错，不会使用已保存的 key 或其他模型服务。
    上游内置的 DashScope 模型搜索不支持网关协议，因此不启用；其他工具和 MCP 保持可用。

    会话按 default 模式跑：改文件、跑命令之前经确认卡片问你；Wonton 插件的工具也从聊天里调。
    和它的对话是核心建的加密私聊，重启后接着聊。
  en: |
    Qwen Code is Alibaba's coding AI, living in your chat. Models use the magpie model gateway only;
    no key is entered in the plugin. An unavailable gateway produces an explicit error instead of
    using saved keys or other model services. The built-in DashScope model-backed search does not
    support the gateway protocol and is disabled; other tools and MCP remain available.

    Sessions run in default mode: it asks through confirmation cards before editing files or running
    commands; Wonton plugin tools are called from the chat.
    The chat is an encrypted direct message the core creates, and it carries on after a restart.
release_notes:
  zh: 更新 ACP bridge 到包含旁聊修复的版本，修复旁聊消息被误判为不支持输入的问题。
  en: Updates the ACP bridge to include the topic-chat fix, preventing topic messages from being misclassified as unsupported input.
  zh-Hant: 更新 ACP bridge 至包含旁聊修復的版本，修復旁聊訊息被誤判為不支援輸入的問題。
  ja: ACP bridge を話題チャット修正を含む版に更新し、話題メッセージが入力非対応と誤判定される問題を修正しました。
