id: ai.qwen-code
version: 0.1.1
title: { zh: AI 编程助手（Qwen Code）, en: Coding Bot (Qwen Code) }
description:
  zh: 阿里巴巴（通义千问）家的编程助手：在聊天里帮你写代码、改文件、跑命令，动手前先弹卡片问你。直接用模型设置就行，也能填自己的千问 key。
  en: "Alibaba's Qwen coding bot: it writes code, edits files and runs commands from your chat, asking with a card before it acts. Works with your Models setup, or your own Qwen key."
about:
  zh: |
    Qwen Code 是阿里巴巴家的编程 AI，住进你的聊天里。默认用模型设置里配好的 AI，不用账号、不用填
    key；也可以贴上自己的千问 key：在应用页打开登录网页（管默认 Bot）或在聊天里发 /wonton login
    （管这个聊天的 Bot），贴上 key（阿里云百炼的 key；其他平台的 key 请在模型设置里加）。

    会话按 default 模式跑：改文件、跑命令之前经确认卡片问你；Wonton 插件的工具也从聊天里调。
    和它的对话是核心建的加密私聊，重启后接着聊。
  en: |
    Qwen Code is Alibaba's coding AI, living in your chat. By default it uses the AI set up in
    Models — no account, no key. Or paste your own Qwen key: open the sign-in page on the app
    screen (for the default bot) or send /wonton login in the chat (for this chat's bot) and
    paste the key (from Alibaba Cloud Model Studio; add keys from other platforms in Models).

    Sessions run in default mode: it asks through confirmation cards before editing files or running
    commands; Wonton plugin tools are called from the chat.
    The chat is an encrypted direct message the core creates, and it carries on after a restart.
release_notes:
  zh: 说明改成更好懂的说法。
  en: Clearer title and description.
license: Apache-2.0
notices: [NOTICE, image/LICENSE.qwen-code]
homepage: https://github.com/QwenLM/qwen-code
tags: { zh: [AI, 开发], en: [AI, Development] }
acp_mode: default
memory: 3G
env:
  # 官方 API key 登录的缺省端点和模型（阿里云百炼）；接了网关时被网关钩子的值顶掉。
  OPENAI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
  OPENAI_MODEL: qwen3-coder-plus
webui: true
login:
  - id: api-key
    title: { zh: Qwen API key, en: Qwen API key }
