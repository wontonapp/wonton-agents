# 本文件由 gen/gen.py 从 agent.yaml 和 template/ 生成：改 agent.yaml 后重新生成，不要手改。
# bridge 说 ACP、不认识任何一家 Agent；两个服务共享 ACP socket 所在的 run/ 子目录和工作区（bridge 把主人发来的
# 图片和文件落到工作区的 wonton-attachments/ 下，再把路径交给 Agent）。bridge 的 crypto store 和 Matrix 令牌不给
# agent，agent 的 HOME 不给 bridge。
services:
  agent:
    image: ghcr.io/wontonapp/wonton-agents/claude-code:0.1.2
    # 底座镜像固定用 65532，入口不再降权；bridge 挂同一个 run/ 目录，两个服务的属主必须相同。
    user: "65532:65532"
    restart: unless-stopped
    environment:
      HOME: /data/agent/home
      # 底座每次启动按有没有值选路：三个 WONTON_MODEL_* 都有值时调网关钩子，任一为空就清掉
      # 网关配置、用 Agent 自己的登录态。这里不写代理变量，写了空值会把核心注入的顶掉。
      WONTON_MODEL_BASE_URL: ${WONTON_MODEL_BASE_URL:-}
      WONTON_MODEL_API_KEY: ${WONTON_MODEL_API_KEY:-}
      WONTON_MODEL_DEFAULT: ${WONTON_MODEL_DEFAULT:-}
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      # 容器里没有浏览器：登录命令只打链接，用户自己开浏览器拿 code。
      NO_BROWSER: "1"
      WONTON_MODEL_ANTHROPIC_BASE_URL: ${WONTON_MODEL_ANTHROPIC_BASE_URL:-}
      ENABLE_TOOL_SEARCH: "false"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
    volumes:
      - ${WONTON_BOT_DATA:?需要 Bot 数据目录}/agent:/data/agent
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      # socket 是就绪的标志（首启下载 CLI 可能要几分钟）：有它才算能接连接。
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      start_interval: 2s

  bridge:
    # 桥镜像的版本和摘要只写这一处；桥升级改这里，再重新生成所有子目录。
    image: ghcr.io/wontonapp/wonton-acp-bridge:main-c69aebc@sha256:ce235c94454fdad3fbac729db5d21a8bcdec88688f43e6cd9aebe9efbac2c85d
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_started
    environment:
      HOME: /data/bridge
      WONTON_BOT_DATA: /data
      WONTON_BRIDGE_DATA: /data/bridge
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      WONTON_MATRIX_HOMESERVER: ${WONTON_MATRIX_HOMESERVER:?需要 Matrix 地址}
      WONTON_MATRIX_ACCESS_TOKEN: ${WONTON_MATRIX_ACCESS_TOKEN:?需要 Bot 的 Matrix 访问令牌}
      # 名单变量 0.9 起改叫 WONTON_MATRIX_ALLOWED_USERS；两个名字都传，新旧桥都能读。
      WONTON_MATRIX_ALLOWED_USERS: ${WONTON_MATRIX_ALLOWED_USERS:-${WONTON_MATRIX_OWNER:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_OWNER: ${WONTON_MATRIX_OWNER:-${WONTON_MATRIX_ALLOWED_USERS:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_HOME_ROOM: ${WONTON_MATRIX_HOME_ROOM:?需要主人与 Bot 的主房间}
      WONTON_MCP_URL: ${WONTON_MCP_URL:?需要 MCP 总线地址}
      # 主会话的 ACP 模式；话题会话要更严的「改前先问」模式时，在 agent.yaml 配 acp_topic_mode。
      WONTON_ACP_MODE: default
    volumes:
      - ${WONTON_BOT_DATA}/bridge:/data/bridge
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
  # 登录网页的入口：webui 不能指向 Bot 服务（旧核心仍按这条判），而登录页在 agent 容器里（每个 Bot 一份），
  # 所以架一个全插件一份的转发。插件页只开默认 Bot 的那一份，聊天里的 /wonton login 用当前 Bot。
  web:
    image: ghcr.io/wontonapp/wonton-agents/claude-code:0.1.2
    user: "65532:65532"
    restart: unless-stopped
    entrypoint: ["python3", "/usr/local/lib/wonton-agent/web-proxy"]
    environment:
      HOME: /data/agent/home
      WEB_PORT: "8080"
    healthcheck:
      # 本地监听和上游都要通：上游没了这台也不该算健康。
      test: ["CMD", "python3", "-c", "import socket; [socket.create_connection(a, 3).close() for a in [('127.0.0.1', 8080), ('agent-default', 8080)]]"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

x-wonton:
  spec: "0.6"
  id: ai.claude-code
  version: 0.1.2
  kind: agent
  title: { zh: AI 编程助手（Claude Code）, en: Coding Bot (Claude Code) }
  description:
    zh: Anthropic（Claude）家的编程助手：在聊天里帮你写代码、改文件、跑命令，动手前先弹卡片问你。适合已经有 Claude 付费订阅的人；模型设置不支持它时，要用 Pro 及以上订阅或自己的 key 登录。
    en: "Anthropic's Claude as a coding bot: it writes code, edits files and runs commands from your chat, asking with a card before it acts. Good if you already pay for Claude — if your Models setup can't serve it, sign in with a Pro or higher plan or your own key."
  icon: icon.svg
  notices: [NOTICE, image/LICENSE.claude-agent-acp, image/LICENSE.claude-code]
  author: { name: Wonton plugin authors }
  homepage: https://github.com/agentclientprotocol/claude-agent-acp
  license: Apache-2.0
  tags: { zh: [AI, 开发], en: [AI, Development] }
  about:
    zh: |
      Claude Code 是 Anthropic 家的编程 AI，住进你的聊天里：改文件、跑命令之前先弹确认卡片问你；
      你装的应用提供的工具也能在聊天里用。可以走模型设置，也可以用你自己的 Anthropic 账号或 key
      登录（下面细说）。

      接上模型网关（要提供 Anthropic Messages 接口）时默认走网关，不用账号。没接网关时，在插件页的登录
      网页（默认 Bot）或聊天里发 /wonton login（这个聊天对应的 Bot）登录：用 Claude 订阅或 Anthropic
      Console 登录（粘一次登录码），也可以贴一个自己的 Anthropic API key。订阅需要 Pro、Max、Ultra、
      Team 或 Enterprise；免费版不含 Claude Code。
    en: |
      Claude Code is Anthropic's coding AI, living in your chat: it sends an approval request before
      editing files or running commands, and the tools your apps provide work from the chat too. It
      can use your Models setup or sign in with your own Anthropic account or key (details below).

      With a model gateway that speaks Anthropic Messages it goes through the gateway by default,
      with no account. Without one, sign in from the login page on the plugin screen (default bot)
      or send /wonton login in the chat (this chat's bot): with a Claude subscription or Anthropic
      Console (paste one login code), or paste your own Anthropic API key.
      Subscriptions need Pro, Max, Ultra, Team or Enterprise; the free plan has no Claude Code.
  release_notes:
    zh: AI 正忙时你接着发的消息会直接递给它，不用等这一轮做完；能收图片和文件。
    en: Messages you send while the AI is busy now reach it right away instead of waiting for the turn to end; it can take images and files.
  webui:
    service: web
    port: 8080
    sso: none
  agent:
    protocol: acp
    login:
      - id: claudeai
        title: { zh: Claude 订阅, en: Claude subscription }
      - id: console
        title: { zh: Anthropic Console, en: Anthropic Console }
      - id: api-key
        title: { zh: Anthropic API key, en: Anthropic API key }
  bot:
    display_name: { zh: AI 编程助手（Claude Code）, en: Coding Bot (Claude Code) }
  bots:
    services: [agent, bridge]
  permissions:
    - matrix.bot
    - tools
    - models
    # 登录和官方模型请求都要出网；底座首启下载闭源 CLI 也走这里。
    - network.egress
  requirements:
    arch: [amd64, arm64]
    memory: 4G
