id: ai.claude-code
version: 0.1.4
title: { zh: AI 编程助手（Claude Code）, en: Coding Bot (Claude Code) }
description:
  zh: Anthropic（Claude）家的编程助手：在聊天里帮你写代码、改文件、跑命令，动手前先弹卡片问你。默认经 magpie 模型网关，也能明确选择 Claude 付费订阅。
  en: "Anthropic's coding bot: it writes code, edits files and runs commands from chat, asking with a card before it acts. Uses magpie by default, or an explicitly selected Claude subscription."
about:
  zh: |
    Claude Code 是 Anthropic 家的编程 AI，住进你的聊天里：改文件、跑命令之前先弹确认卡片问你；
    你装的应用提供的工具也能在聊天里用。模型默认走 magpie 模型网关（须提供 Anthropic Messages 接口）。
    网关未就绪会报错，不会因已有账号或旧 key 自动改连其他服务。

    在插件页的登录网页或聊天里 /wonton login 明确选择 Claude 订阅并完成登录，才会使用官方订阅；
    即使网关可用也不会自动切回。需要 Claude Code 支持的付费订阅；免费版不含 Claude Code。
    选“magpie 模型网关”可切回网关。不提供 API key 或 Console API 计费登录。
  en: |
    Claude Code is Anthropic's coding AI, living in your chat: it sends an approval request before
    editing files or running commands, and the tools your apps provide work from the chat too. It
    uses magpie by default (an Anthropic Messages endpoint is required). An unavailable gateway
    reports an error instead of falling back to an old account or key.

    Explicitly select Claude subscription in the plugin login page or /wonton login and complete
    sign-in to use your subscription, independently of gateway availability. A supported paid plan
    is required. Select magpie to return to the gateway. API-key and Console API billing logins
    are not offered.
release_notes:
  zh: 更新底座到 0.1.2，修复模型来源模块缺失导致的启动错误；网关未就绪仍明确报错，不会回退。
  en: Updates the base image to 0.1.2, fixing startup when the model-source module is missing; gateway errors remain explicit with no fallback.
  zh-Hant: 更新底座至 0.1.2，修復模型來源模組缺失造成的啟動錯誤；網關未就緒仍明確報錯，不會退回。
  ja: ベースイメージを 0.1.2 に更新し、モデルソースモジュール不足による起動エラーを修正しました。ゲートウェイ未準備時は明示的にエラーを示し、フォールバックしません。
license: Apache-2.0
notices: [NOTICE, image/LICENSE.claude-agent-acp, image/LICENSE.claude-code]
homepage: https://github.com/agentclientprotocol/claude-agent-acp
tags: { zh: [AI, 开发], en: [AI, Development] }
acp_mode: default
memory: 4G
env:
  WONTON_MODEL_ANTHROPIC_BASE_URL: ${WONTON_MODEL_ANTHROPIC_BASE_URL:-}
  ENABLE_TOOL_SEARCH: "false"
  # 关掉自动更新、遥测、错误上报和非必要请求；官方 devcontainer 也是这么配的。
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  DISABLE_AUTOUPDATER: "1"
  DISABLE_TELEMETRY: "1"
  DISABLE_ERROR_REPORTING: "1"
webui: true
login:
  - id: claudeai
    title: { zh: Claude 订阅, en: Claude subscription }
  - id: magpie
    title: { zh: magpie 模型网关, en: magpie model gateway }
