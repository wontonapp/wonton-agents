# 本文件由 gen/gen.py 从 agent.yaml 和 template/ 生成：改 agent.yaml 后重新生成，不要手改。
# bridge 说 ACP、不认识任何一家 Agent；两个服务共享 ACP socket 所在的 run/ 子目录和工作区（bridge 把主人发来的
# 图片和文件落到工作区的 wonton-attachments/ 下，再把路径交给 Agent）。bridge 的 crypto store 和 Matrix 令牌不给
# agent，agent 的 HOME 不给 bridge。
services:
  agent:
    image: ghcr.io/wontonapp/wonton-agents/echo:0.1.2
    # 底座镜像固定用 65532，入口不再降权；bridge 挂同一个 run/ 目录，两个服务的属主必须相同。
    user: "65532:65532"
    restart: unless-stopped
    environment:
      HOME: /data/agent/home
      # 底座每次启动按有没有值选路：三个 WONTON_MODEL_* 都有值时调网关钩子，任一为空就清掉
      # 网关配置、用 Agent 自己的登录态。这里不写代理变量，写了空值会把核心注入的顶掉。
      WONTON_MODEL_BASE_URL: ${WONTON_MODEL_BASE_URL:-}
      WONTON_MODEL_API_KEY: ${WONTON_MODEL_API_KEY:-}
      WONTON_MODEL_DEFAULT: ${WONTON_MODEL_DEFAULT:-}
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      # 容器里没有浏览器：登录命令只打链接，用户自己开浏览器拿 code。
      NO_BROWSER: "1"
    volumes:
      - ${WONTON_BOT_DATA:?需要 Bot 数据目录}/agent:/data/agent
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      # socket 是就绪的标志（首启下载 CLI 可能要几分钟）：有它才算能接连接。
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      start_interval: 2s

  bridge:
    # 桥镜像的版本和摘要只写这一处；桥升级改这里，再重新生成所有子目录。
    image: ghcr.io/wontonapp/wonton-acp-bridge:main-452a377@sha256:1d4526dc5b552a08dc6eb8c17f68d0fb0eb08506b815c842edc34914acf2d3c1
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_started
    environment:
      HOME: /data/bridge
      WONTON_BOT_DATA: /data
      WONTON_BRIDGE_DATA: /data/bridge
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      WONTON_MATRIX_HOMESERVER: ${WONTON_MATRIX_HOMESERVER:?需要 Matrix 地址}
      WONTON_MATRIX_ACCESS_TOKEN: ${WONTON_MATRIX_ACCESS_TOKEN:?需要 Bot 的 Matrix 访问令牌}
      # 名单变量 0.9 起改叫 WONTON_MATRIX_ALLOWED_USERS；两个名字都传，新旧桥都能读。
      WONTON_MATRIX_ALLOWED_USERS: ${WONTON_MATRIX_ALLOWED_USERS:-${WONTON_MATRIX_OWNER:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_OWNER: ${WONTON_MATRIX_OWNER:-${WONTON_MATRIX_ALLOWED_USERS:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_HOME_ROOM: ${WONTON_MATRIX_HOME_ROOM:?需要主人与 Bot 的主房间}
      WONTON_MCP_URL: ${WONTON_MCP_URL:?需要 MCP 总线地址}
      # 主会话的 ACP 模式；话题会话要更严的「改前先问」模式时，在 agent.yaml 配 acp_topic_mode。
      WONTON_ACP_MODE: plan
    volumes:
      - ${WONTON_BOT_DATA}/bridge:/data/bridge
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
  # 登录网页的入口：webui 不能指向 Bot 服务（旧核心仍按这条判），而登录页在 agent 容器里（每个 Bot 一份），
  # 所以架一个全插件一份的转发。插件页只开默认 Bot 的那一份，聊天里的 /wonton login 用当前 Bot。
  web:
    image: ghcr.io/wontonapp/wonton-agents/echo:0.1.2
    user: "65532:65532"
    restart: unless-stopped
    entrypoint: ["python3", "/usr/local/lib/wonton-agent/web-proxy"]
    environment:
      HOME: /data/agent/home
      WEB_PORT: "8080"
    healthcheck:
      # 本地监听和上游都要通：上游没了这台也不该算健康。
      test: ["CMD", "python3", "-c", "import socket; [socket.create_connection(a, 3).close() for a in [('127.0.0.1', 8080), ('agent-default', 8080)]]"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

x-wonton:
  spec: "0.6"
  id: ai.echo
  version: 0.1.2
  kind: agent
  title: { zh: Bot 样例（Echo）, en: Sample Bot (Echo) }
  description:
    zh: 给开发者参考的样品：你说什么它就回什么，不会真的帮你做事。
    en: "A sample for developers: it repeats whatever you send and does nothing else."
  icon: icon.svg
  notices: [NOTICE]
  author: { name: Wonton plugin authors }
  homepage: https://github.com/wontonapp/wonton-agents
  license: Apache-2.0
  tags: { zh: [AI, 工具], en: [AI, Tools] }
  about:
    zh: |
      Echo 是给开发者看的示范：装上就能跑，你说什么它回什么。

      把它当「新增一家」的底稿：复制本目录，改 agent.yaml、agent.toml、图标和 NOTICE，跑
      python3 gen/gen.py 重新生成 compose，再接上真实 CLI 的启动命令、网关钩子和登录。

      接上模型网关时走网关（样例钩子只把模型名写进日志）；也可以用样例登录（任意一行 key）。
      它不连任何上游服务，只用来演示和联调。
    en: |
      Echo is a sample for developers: it runs as-is and echoes back whatever you send.

      Treat it as the starting point for adding an agent: copy this directory, change agent.yaml,
      agent.toml, the icon and NOTICE, regenerate the compose with python3 gen/gen.py, then wire
      up a real CLI's ACP command, gateway hook and logins.

      With a model gateway it goes through the gateway (the sample hook just logs the model name);
      the sample login accepts any key. It talks to no upstream service; for demos and testing only.
  release_notes:
    zh: 能收图片和文件；正忙时接着发的几条消息，做完这一轮后合成一条处理。
    en: Takes images and files; messages sent while busy are combined into one after the current turn.
  webui:
    service: web
    port: 8080
    sso: none
  agent:
    protocol: acp
    login:
      - id: sample
        title: { zh: 样例账号（读一行 key）, en: Sample account (paste one key) }
  bot:
    display_name: { zh: Bot 样例（Echo）, en: Sample Bot (Echo) }
  bots:
    services: [agent, bridge]
  permissions:
    - matrix.bot
    - tools
    - models
    # 登录和官方模型请求都要出网；底座首启下载闭源 CLI 也走这里。
    - network.egress
  requirements:
    arch: [amd64, arm64]
    memory: 512M
