# echo-agent 的配置：子镜像的全部差异就是这份文件和 Dockerfile COPY 进来的东西。
[acp]
command = ["python3", "/usr/local/bin/echo-agent"]

[skills]
target = "~/.agents/skills"

[gateway]
hook = "/usr/local/lib/wonton-agent/gateway"

# 登录网页：容器里 0.0.0.0:8080 起一个登录页面，插件清单把它声明成 webui（sso: none，
# 核心网关挡在前面），从 App 的插件页打开。
[web]
port = 8080

# 最小终端登录样例：读一行当 key，写标记文件后打印 logged in 退出 0；成功后容器按
# restart 策略重启。status 是状态命令：退出码 0 = 已登录，非 0 = 没登录，网页列表显示用。
[[login]]
id = "sample"
name = "样例账号（读一行 key）"
command = ["/bin/sh", "/usr/local/lib/wonton-agent/login"]
status = ["/bin/sh", "/usr/local/lib/wonton-agent/login-status"]
