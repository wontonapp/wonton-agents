# Kimi Code 的配置：官方 npm 包首次启动时按摘要下载（上游程序是 MIT，见 NOTICE），
# ACP 启动命令、网关钩子、登录和登录网页是子镜像的全部差异。
# ACP 命令跟包里 package.json 的 bin 字段：kimi -> dist/main.mjs（包根的入口，不是 bin/ 下的）。
[acp]
command = ["/data/agent/tools/kimi/2.5.3/dist/main.mjs", "acp"]

[[install]]
name = "kimi"
version = "2.5.3"
source = "npm"
package = "@moonshot-ai/kimi-code"
integrity = "sha512-NdBttZiktZhKdH1tu/25A+Il1MxO1RTE1gAdZDmogoCT4g8L7k3pcLeJpwy7PNJvHo9CF8fDJiaZ9nsIPn+Gag=="

[skills]
# kimi-code 的用户级 skill 根目录（用户主目录下的 skills/，主目录是 $KIMI_CODE_HOME 即 ~/.kimi-code）。
target = "~/.kimi-code/skills"

[gateway]
hook = "/usr/local/lib/wonton-agent/gateway"

# 登录网页：容器里 0.0.0.0:8080，插件清单声明成 webui（核心网关挡在前面）。
[web]
port = 8080

# 设备码登录：kimi login 打印链接和设备码，轮询等待授权，不需要输入；成功后容器重启，
# 没接网关时钩子把模型指回账号登录态。
[[login]]
id = "kimi-account"
name = "Kimi 账号（设备码）"
command = ["/data/agent/tools/kimi/2.5.3/dist/main.mjs", "login"]
status = ["/usr/local/lib/wonton-agent/login-status", "kimi-account"]

# 开放平台 API key（platform.kimi.com）：读一行 key，先对平台验证再写进配置。
[[login]]
id = "platform-key"
name = "Kimi 开放平台 API key"
command = ["/usr/local/lib/wonton-agent/login-platform-key"]
status = ["/usr/local/lib/wonton-agent/login-status", "platform-key"]
