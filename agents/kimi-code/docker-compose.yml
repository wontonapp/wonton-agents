# 本文件由 gen/gen.py 从 agent.yaml 和 template/ 生成：改 agent.yaml 后重新生成，不要手改。
# bridge 说 ACP、不认识任何一家 Agent；两个服务共享 ACP socket 所在的 run/ 子目录和工作区（bridge 把主人发来的
# 图片和文件落到工作区的 wonton-attachments/ 下，再把路径交给 Agent）。bridge 的 crypto store 和 Matrix 令牌不给
# agent，agent 的 HOME 不给 bridge。
services:
  agent:
    image: ghcr.io/wontonapp/wonton-agents/kimi-code:0.1.4@sha256:f533bb7958adaa1d8709c76f11a0c9b89314d10804b4aaa2c85b41fa8d232b99
    # 底座镜像固定用 65532，入口不再降权；bridge 挂同一个 run/ 目录，两个服务的属主必须相同。
    user: "65532:65532"
    restart: unless-stopped
    environment:
      HOME: /data/agent/home
      # 底座每次启动按有没有值选路：三个 WONTON_MODEL_* 都有值时调网关钩子，任一为空就清掉
      # 网关配置、用 Agent 自己的登录态。这里不写代理变量，写了空值会把核心注入的顶掉。
      WONTON_MODEL_BASE_URL: ${WONTON_MODEL_BASE_URL:-}
      WONTON_MODEL_API_KEY: ${WONTON_MODEL_API_KEY:-}
      WONTON_MODEL_DEFAULT: ${WONTON_MODEL_DEFAULT:-}
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      # 容器里没有浏览器：登录命令只打链接，用户自己开浏览器拿 code。
      NO_BROWSER: "1"
    volumes:
      - ${WONTON_BOT_DATA:?需要 Bot 数据目录}/agent:/data/agent
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      # socket 是就绪的标志（首启下载 CLI 可能要几分钟）：有它才算能接连接。
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      start_interval: 2s

  bridge:
    # 桥镜像的版本和摘要只写这一处；桥升级改这里，再重新生成所有子目录。
    image: ghcr.io/wontonapp/wonton-acp-bridge:main-c69aebc@sha256:ce235c94454fdad3fbac729db5d21a8bcdec88688f43e6cd9aebe9efbac2c85d
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_started
    environment:
      HOME: /data/bridge
      WONTON_BOT_DATA: /data
      WONTON_BRIDGE_DATA: /data/bridge
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      WONTON_MATRIX_HOMESERVER: ${WONTON_MATRIX_HOMESERVER:?需要 Matrix 地址}
      WONTON_MATRIX_ACCESS_TOKEN: ${WONTON_MATRIX_ACCESS_TOKEN:?需要 Bot 的 Matrix 访问令牌}
      # 名单变量 0.9 起改叫 WONTON_MATRIX_ALLOWED_USERS；两个名字都传，新旧桥都能读。
      WONTON_MATRIX_ALLOWED_USERS: ${WONTON_MATRIX_ALLOWED_USERS:-${WONTON_MATRIX_OWNER:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_OWNER: ${WONTON_MATRIX_OWNER:-${WONTON_MATRIX_ALLOWED_USERS:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_HOME_ROOM: ${WONTON_MATRIX_HOME_ROOM:?需要主人与 Bot 的主房间}
      WONTON_MCP_URL: ${WONTON_MCP_URL:?需要 MCP 总线地址}
      # 主会话的 ACP 模式；话题会话要更严的「改前先问」模式时，在 agent.yaml 配 acp_topic_mode。
      WONTON_ACP_MODE: default
    volumes:
      - ${WONTON_BOT_DATA}/bridge:/data/bridge
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
  # 登录网页的入口：webui 不能指向 Bot 服务（旧核心仍按这条判），而登录页在 agent 容器里（每个 Bot 一份），
  # 所以架一个全插件一份的转发。插件页只开默认 Bot 的那一份，聊天里的 /wonton login 用当前 Bot。
  web:
    image: ghcr.io/wontonapp/wonton-agents/kimi-code:0.1.4@sha256:f533bb7958adaa1d8709c76f11a0c9b89314d10804b4aaa2c85b41fa8d232b99
    user: "65532:65532"
    restart: unless-stopped
    entrypoint: ["python3", "/usr/local/lib/wonton-agent/web-proxy"]
    environment:
      HOME: /data/agent/home
      WEB_PORT: "8080"
    healthcheck:
      # 本地监听和上游都要通：上游没了这台也不该算健康。
      test: ["CMD", "python3", "-c", "import socket; [socket.create_connection(a, 3).close() for a in [('127.0.0.1', 8080), ('agent-default', 8080)]]"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

x-wonton:
  spec: "0.6"
  id: ai.kimi-code
  version: 0.1.4
  kind: agent
  title: { zh: AI 编程助手（Kimi Code）, en: Coding Bot (Kimi Code) }
  description:
    zh: Kimi（月之暗面）家的编程助手：读代码、改文件、跑命令，改文件和跑命令前都会出确认卡，你同意才执行。默认用 magpie，也可明确选择 Kimi 官方订阅。
    en: "Kimi's coding bot from Moonshot AI: it reads code, edits files and runs commands, asking with a confirmation card before edits and commands. Uses magpie by default, or an explicitly selected Kimi subscription."
  icon: icon.svg
  notices: [NOTICE]
  author: { name: Wonton plugin authors }
  homepage: https://github.com/wontonapp/wonton-agents
  license: MIT
  tags: { zh: [AI, 工具], en: [AI, Tools] }
  about:
    zh: |
      Kimi Code 是月之暗面（Kimi）家的编程 AI。装进云吞后，它在和你的私聊里干活：读代码、改文件、
      跑命令；改文件和跑命令前都会出确认卡，你同意才执行。

      模型默认走 magpie 模型网关，不用自己的账号；网关未就绪会报错，不会自动改连已有账号或旧 key。
      在插件页的登录网页或聊天里 /wonton login 明确完成 Kimi 账号设备码登录后，才使用官方订阅，
      即使网关可用也不会自动切回；选“magpie 模型网关”可切回网关。不提供开放平台 API key 登录。
    en: |
      Kimi Code is Moonshot AI's coding AI. In Wonton it works in your private chat: it reads
      code, edits files and runs commands, asking with a confirmation card before edits and
      commands.

      Model requests use magpie by default. An unavailable gateway reports an error, without falling
      back to saved accounts or keys. Explicitly complete Kimi account device-code sign-in through
      the plugin login page or /wonton login to use the official subscription independently of the
      gateway. Select magpie to return. Platform API-key login is not offered.
  release_notes:
    zh: 模型默认走 magpie；明确完成 Kimi 订阅登录才使用官方账号。网关出错不再自动换来源，移除开放平台 API key 登录，统一主模型和子代理模型。
    en: Models use magpie by default; explicit Kimi subscription sign-in selects the official account. Gateway errors no longer change sources. Platform API-key login was removed, and primary and subagent models now share the selected source.
    zh-Hant: 模型預設走 magpie；明確完成 Kimi 訂閱登入才使用官方帳號。網關出錯不再自動換來源，移除開放平台 API key 登入，統一主模型與子代理模型。
    ja: モデルは既定で magpie を利用し、Kimi サブスクリプションへの明示的なログイン時のみ公式アカウントを使います。ゲートウェイのエラーで接続先を変えず、API キーログインを削除し、メインとサブエージェントのモデルを統一しました。
  webui:
    service: web
    port: 8080
    sso: none
  agent:
    protocol: acp
    login:
      - id: kimi-account
        title: { zh: Kimi 账号（设备码）, en: Kimi account (device code) }
      - id: magpie
        title: { zh: magpie 模型网关, en: magpie model gateway }
  bot:
    display_name: { zh: AI 编程助手（Kimi Code）, en: Coding Bot (Kimi Code) }
  bots:
    services: [agent, bridge]
  permissions:
    - matrix.bot
    - tools
    - models
    # 登录和官方模型请求都要出网；底座首启下载闭源 CLI 也走这里。
    - network.egress
  requirements:
    arch: [amd64, arm64]
    memory: 512M
