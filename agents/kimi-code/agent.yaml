id: ai.kimi-code
version: 0.1.5
title: { zh: AI 编程助手（Kimi Code）, en: Coding Bot (Kimi Code) }
description:
  zh: Kimi（月之暗面）家的编程助手：读代码、改文件、跑命令，改文件和跑命令前都会出确认卡，你同意才执行。默认用 magpie，也可明确选择 Kimi 官方订阅。
  en: "Kimi's coding bot from Moonshot AI: it reads code, edits files and runs commands, asking with a confirmation card before edits and commands. Uses magpie by default, or an explicitly selected Kimi subscription."
about:
  zh: |
    Kimi Code 是月之暗面（Kimi）家的编程 AI。装进云吞后，它在和你的私聊里干活：读代码、改文件、
    跑命令；改文件和跑命令前都会出确认卡，你同意才执行。

    模型默认走 magpie 模型网关，不用自己的账号；网关未就绪会报错，不会自动改连已有账号或旧 key。
    在插件页的登录网页或聊天里 /wonton login 明确完成 Kimi 账号设备码登录后，才使用官方订阅，
    即使网关可用也不会自动切回；选“magpie 模型网关”可切回网关。不提供开放平台 API key 登录。
  en: |
    Kimi Code is Moonshot AI's coding AI. In Wonton it works in your private chat: it reads
    code, edits files and runs commands, asking with a confirmation card before edits and
    commands.

    Model requests use magpie by default. An unavailable gateway reports an error, without falling
    back to saved accounts or keys. Explicitly complete Kimi account device-code sign-in through
    the plugin login page or /wonton login to use the official subscription independently of the
    gateway. Select magpie to return. Platform API-key login is not offered.
release_notes:
  zh: 更新底座到 0.1.2，修复模型来源模块缺失导致的启动错误；网关出错不再自动换来源。
  en: Updates the base image to 0.1.2, fixing startup when the model-source module is missing; gateway errors do not change the selected source.
  zh-Hant: 更新底座至 0.1.2，修復模型來源模組缺失造成的啟動錯誤；網關出錯不再自動更換來源。
  ja: ベースイメージを 0.1.2 に更新し、モデルソースモジュール不足による起動エラーを修正しました。ゲートウェイエラーで接続先を変更しません。
license: MIT
notices: [NOTICE]
homepage: https://github.com/wontonapp/wonton-agents
tags: { zh: [AI, 工具], en: [AI, Tools] }
acp_mode: default
memory: 512M
login:
  - id: kimi-account
    title: { zh: Kimi 账号（设备码）, en: Kimi account (device code) }
  - id: magpie
    title: { zh: magpie 模型网关, en: magpie model gateway }
webui: true
