# 本文件由 gen/gen.py 从 agent.yaml 和 template/ 生成：改 agent.yaml 后重新生成，不要手改。
# bridge 说 ACP、不认识任何一家 Agent；两个服务共享 ACP socket 所在的 run/ 子目录和工作区（bridge 把主人发来的
# 图片和文件落到工作区的 wonton-attachments/ 下，再把路径交给 Agent）。bridge 的 crypto store 和 Matrix 令牌不给
# agent，agent 的 HOME 不给 bridge。
services:
  agent:
    image: ghcr.io/wontonapp/wonton-agents/codex:0.1.2@sha256:bf08c0e54d2dbaf74ab53cd2c5bd8c1cd03eaea81877b4264f78eaabf9130b57
    # 底座镜像固定用 65532，入口不再降权；bridge 挂同一个 run/ 目录，两个服务的属主必须相同。
    user: "65532:65532"
    restart: unless-stopped
    environment:
      HOME: /data/agent/home
      # 底座每次启动按有没有值选路：三个 WONTON_MODEL_* 都有值时调网关钩子，任一为空就清掉
      # 网关配置、用 Agent 自己的登录态。这里不写代理变量，写了空值会把核心注入的顶掉。
      WONTON_MODEL_BASE_URL: ${WONTON_MODEL_BASE_URL:-}
      WONTON_MODEL_API_KEY: ${WONTON_MODEL_API_KEY:-}
      WONTON_MODEL_DEFAULT: ${WONTON_MODEL_DEFAULT:-}
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      # 容器里没有浏览器：登录命令只打链接，用户自己开浏览器拿 code。
      NO_BROWSER: "1"
      RUST_LOG: info
    volumes:
      - ${WONTON_BOT_DATA:?需要 Bot 数据目录}/agent:/data/agent
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      # socket 是就绪的标志（首启下载 CLI 可能要几分钟）：有它才算能接连接。
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      start_interval: 2s

  bridge:
    # 桥镜像的版本和摘要只写这一处；桥升级改这里，再重新生成所有子目录。
    image: ghcr.io/wontonapp/wonton-acp-bridge:main-c69aebc@sha256:ce235c94454fdad3fbac729db5d21a8bcdec88688f43e6cd9aebe9efbac2c85d
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_started
    environment:
      HOME: /data/bridge
      WONTON_BOT_DATA: /data
      WONTON_BRIDGE_DATA: /data/bridge
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      WONTON_MATRIX_HOMESERVER: ${WONTON_MATRIX_HOMESERVER:?需要 Matrix 地址}
      WONTON_MATRIX_ACCESS_TOKEN: ${WONTON_MATRIX_ACCESS_TOKEN:?需要 Bot 的 Matrix 访问令牌}
      # 名单变量 0.9 起改叫 WONTON_MATRIX_ALLOWED_USERS；两个名字都传，新旧桥都能读。
      WONTON_MATRIX_ALLOWED_USERS: ${WONTON_MATRIX_ALLOWED_USERS:-${WONTON_MATRIX_OWNER:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_OWNER: ${WONTON_MATRIX_OWNER:-${WONTON_MATRIX_ALLOWED_USERS:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_HOME_ROOM: ${WONTON_MATRIX_HOME_ROOM:?需要主人与 Bot 的主房间}
      WONTON_MCP_URL: ${WONTON_MCP_URL:?需要 MCP 总线地址}
      # 主会话的 ACP 模式；话题会话要更严的「改前先问」模式时，在 agent.yaml 配 acp_topic_mode。
      WONTON_ACP_MODE: read-only
      WONTON_ACP_TOPIC_MODE: read-only
    volumes:
      - ${WONTON_BOT_DATA}/bridge:/data/bridge
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
  # 登录网页的入口：webui 不能指向 Bot 服务（旧核心仍按这条判），而登录页在 agent 容器里（每个 Bot 一份），
  # 所以架一个全插件一份的转发。插件页只开默认 Bot 的那一份，聊天里的 /wonton login 用当前 Bot。
  web:
    image: ghcr.io/wontonapp/wonton-agents/codex:0.1.2@sha256:bf08c0e54d2dbaf74ab53cd2c5bd8c1cd03eaea81877b4264f78eaabf9130b57
    user: "65532:65532"
    restart: unless-stopped
    entrypoint: ["python3", "/usr/local/lib/wonton-agent/web-proxy"]
    environment:
      HOME: /data/agent/home
      WEB_PORT: "8080"
    healthcheck:
      # 本地监听和上游都要通：上游没了这台也不该算健康。
      test: ["CMD", "python3", "-c", "import socket; [socket.create_connection(a, 3).close() for a in [('127.0.0.1', 8080), ('agent-default', 8080)]]"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

x-wonton:
  spec: "0.6"
  id: ai.codex
  version: 0.1.2
  kind: agent
  title: { zh: AI 编程助手（Codex）, en: Coding Bot (Codex) }
  description:
    zh: OpenAI（ChatGPT）家的编程助手：在聊天里帮你写代码、改文件、跑命令，规矩最严——默认只能看，要改动前都先弹卡片问你。直接用模型设置就行，也能登录 ChatGPT 订阅。
    en: "OpenAI's coding bot, from the makers of ChatGPT: it writes code, edits files and runs commands from your chat under the strictest rules — read-only by default, asking with a card before any change. Works with your Models setup, or sign in with a ChatGPT plan."
  icon: icon.svg
  notices: [NOTICE]
  author: { name: Wonton plugin authors }
  homepage: https://github.com/openai/codex
  license: Apache-2.0
  tags: { zh: [AI, 开发], en: [AI, Development] }
  about:
    zh: |
      OpenAI 家的编程 AI（ChatGPT 同门），住进你的聊天里：默认用模型设置里配好的 AI，不用账号、
      不用填 key；没配好时在聊天里发 /wonton login，用设备码登录 ChatGPT 订阅，或贴上自己的
      OpenAI key。它规矩最严：平时只能看不能改，要改文件、跑会越界的命令之前都先弹确认卡片问你；
      你装的应用提供的工具也能在聊天里用。第一次启动时会自动下载官方程序，稍等一下就好。
    en: |
      OpenAI's coding AI (from the makers of ChatGPT), living in your chat: by default it uses the
      AI set up in Models — no account, no key. Without that, send /wonton login in the chat to
      sign in to a ChatGPT plan with a device code, or paste your own OpenAI key. It works under
      the strictest rules: read-only by default, sending an approval request before editing files
      or running commands that reach outside; the tools your apps provide work from the chat too.
      The first start downloads the official program, so give it a moment.
  release_notes:
    zh: AI 正忙时你接着发的几条消息，等它这一轮做完会合成一条交给它；能收图片和文件。
    en: Messages you send while the AI is busy are combined into one and handed over when the current turn ends; it can take images and files.
  webui:
    service: web
    port: 8080
    sso: none
  agent:
    protocol: acp
    login:
      - id: chatgpt
        title: { zh: ChatGPT 账号, en: ChatGPT account }
      - id: api-key
        title: { zh: OpenAI API key, en: OpenAI API key }
  bot:
    display_name: { zh: AI 编程助手（Codex）, en: Coding Bot (Codex) }
  bots:
    services: [agent, bridge]
  permissions:
    - matrix.bot
    - tools
    - models
    # 登录和官方模型请求都要出网；底座首启下载闭源 CLI 也走这里。
    - network.egress
  requirements:
    arch: [amd64, arm64]
    memory: 1G
