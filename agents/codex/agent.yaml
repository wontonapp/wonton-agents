id: ai.codex
version: 0.1.2
title: { zh: AI 编程助手（Codex）, en: Coding Bot (Codex) }
description:
  zh: OpenAI（ChatGPT）家的编程助手：在聊天里帮你写代码、改文件、跑命令，规矩最严——默认只能看，要改动前都先弹卡片问你。直接用模型设置就行，也能登录 ChatGPT 订阅。
  en: "OpenAI's coding bot, from the makers of ChatGPT: it writes code, edits files and runs commands from your chat under the strictest rules — read-only by default, asking with a card before any change. Works with your Models setup, or sign in with a ChatGPT plan."
about:
  zh: |
    OpenAI 家的编程 AI（ChatGPT 同门），住进你的聊天里：默认用模型设置里配好的 AI，不用账号、
    不用填 key；没配好时在聊天里发 /wonton login，用设备码登录 ChatGPT 订阅，或贴上自己的
    OpenAI key。它规矩最严：平时只能看不能改，要改文件、跑会越界的命令之前都先弹确认卡片问你；
    你装的应用提供的工具也能在聊天里用。第一次启动时会自动下载官方程序，稍等一下就好。
  en: |
    OpenAI's coding AI (from the makers of ChatGPT), living in your chat: by default it uses the
    AI set up in Models — no account, no key. Without that, send /wonton login in the chat to
    sign in to a ChatGPT plan with a device code, or paste your own OpenAI key. It works under
    the strictest rules: read-only by default, sending an approval request before editing files
    or running commands that reach outside; the tools your apps provide work from the chat too.
    The first start downloads the official program, so give it a moment.
release_notes:
  zh: AI 正忙时你接着发的几条消息，等它这一轮做完会合成一条交给它；能收图片和文件。
  en: Messages you send while the AI is busy are combined into one and handed over when the current turn ends; it can take images and files.
license: Apache-2.0
notices: [NOTICE]
homepage: https://github.com/openai/codex
tags: { zh: [AI, 开发], en: [AI, Development] }
# Codex 最严格可用的模式，实测只有 read-only：只读工作区，改文件和出网都先经确认卡片问
# 主人。它自带的沙箱在普通 Docker 容器里建不了命名空间，更宽的模式不可用。
acp_mode: read-only
# codex-acp 唯一的“改前先问”模式就是 read-only：话题里也逐次确认，不设时桥仍用上面的
# 模式，但会在每个话题里误报没有这种模式。
acp_topic_mode: read-only
memory: 1G
login:
  - id: chatgpt
    title: { zh: ChatGPT 账号, en: ChatGPT account }
  - id: api-key
    title: { zh: OpenAI API key, en: OpenAI API key }
env:
  # 会话和 MCP 连接的日志进容器日志，出问题时能对着它排查。
  RUST_LOG: info
webui: true
