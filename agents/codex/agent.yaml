id: ai.codex
version: 0.1.3
title: { zh: AI 编程助手（Codex）, en: Coding Bot (Codex) }
description:
  zh: OpenAI（ChatGPT）家的编程助手：在聊天里帮你写代码、改文件、跑命令，规矩最严——默认只能看，要改动前都先弹卡片问你。直接用模型设置就行，也能登录 ChatGPT 订阅。
  en: "OpenAI's coding bot, from the makers of ChatGPT: it writes code, edits files and runs commands from your chat under the strictest rules — read-only by default, asking with a card before any change. Works with your Models setup, or sign in with a ChatGPT plan."
about:
  zh: |
    OpenAI 家的编程 AI（ChatGPT 同门），住进你的聊天里：默认用模型设置里配好的 AI。
    模型没接好会说明原因，不会偷偷改用其他账号。想用 ChatGPT 订阅时，在聊天里发
    /wonton login chatgpt，用设备码登录；发 /wonton login magpie 切回模型设置。
    要改文件、跑会越界的命令之前会弹确认卡片；你装的应用提供的工具也能在聊天里用。
  en: |
    OpenAI's coding AI lives in your chat and uses the AI configured in Models by default.
    If Models is not ready, it reports the reason rather than using another account.
    Choose /wonton login chatgpt to sign in with a ChatGPT plan, or /wonton login magpie
    to return to Models. It asks through confirmation cards before protected changes;
    tools provided by your apps work from the chat too.
release_notes:
  zh: 模型没接好会明确告诉你，不再偷偷改连其他地方；只有你主动登录时才使用 ChatGPT 订阅，也能切回模型设置。
  en: Reports when Models is not ready instead of switching elsewhere; ChatGPT subscriptions are used only after you sign in explicitly, and you can switch back to Models.
  zh-Hant: 模型沒接好會明確告訴你，不再偷偷改連其他地方；只有你主動登入時才使用 ChatGPT 訂閱，也能切回模型設定。
  ja: モデルの準備ができていないときは理由を知らせ、別の接続先には切り替えません。ChatGPT のサブスクリプションは自分でログインしたときだけ使い、モデル設定に戻せます。
license: Apache-2.0
notices: [NOTICE]
homepage: https://github.com/openai/codex
tags: { zh: [AI, 开发], en: [AI, Development] }
# Codex 最严格可用的模式，实测只有 read-only：只读工作区，改文件和出网都先经确认卡片问
# 主人。它自带的沙箱在普通 Docker 容器里建不了命名空间，更宽的模式不可用。
acp_mode: read-only
# codex-acp 唯一的“改前先问”模式就是 read-only：话题里也逐次确认，不设时桥仍用上面的
# 模式，但会在每个话题里误报没有这种模式。
acp_topic_mode: read-only
memory: 1G
login:
  - id: chatgpt
    title: { zh: ChatGPT 账号, en: ChatGPT account }
  - id: magpie
    title: { zh: 模型设置（magpie）, en: Models (magpie) }
env:
  # 会话和 MCP 连接的日志进容器日志，出问题时能对着它排查。
  RUST_LOG: info
webui: true
