# Codex 的安装来源：ACP 适配器和它依赖的 Codex CLI 都不打进镜像，首次启动按
# 版本和 npm dist.integrity 从官方 registry 下载到数据卷（闭源上游的规矩对开源 CLI
# 同样省事：镜像小、升级只改这里）。
[[install]]
name = "codex-acp"
version = "2.6.0"
source = "npm"
package = "@agentclientprotocol/codex-acp"
# npm dist.integrity（sha512-<base64>），registry.npmjs.org 的 2.6.0 元数据。
# 适配器依赖 @openai/codex ^0.166.0，包里没有 npm-shrinkwrap.json，CLI 版本跟着
# semver 走；升级时按注册表机器人的 PR 重取 integrity。
integrity = "sha512-/PBsd0H6URy4bhXhAeXqwb7RqctbXfNceRihAh6nDmn5HJ873uzoHvHxF45YmeWfgOKKRrNRLZjYsket2a7EsQ=="

[acp]
# 适配器的 bin（dist/index.js，shebang 走容器里的 node）。CODEX_PATH 不设：适配器
# 自己从 node_modules 解析 @openai/codex/bin/codex.js 当 CLI（登录和 app-server 都是）。
command = ["/data/agent/tools/codex-acp/2.6.0/dist/index.js"]

[skills]
target = "~/.agents/skills"

[gateway]
hook = "/usr/local/lib/wonton-agent/gateway"

# Codex 的 config.toml 支持 env_key 引用变量名，key 不落盘；网关接好时底座把它
# 解析出来的值加进 ACP 子进程环境，Codex 的模型请求带着它发给网关。
[gateway.env]
OPENAI_API_KEY = "WONTON_MODEL_API_KEY"

# 登录网页：容器里 0.0.0.0:8080，插件清单声明成 webui（核心网关挡在前面）。
[web]
port = 8080

# 官方账号登录：Codex 自己的程序里完成，链接和设备码由桥发进聊天（容器里没有
# 浏览器）。--with-api-key 读 stdin 到 EOF 才收 key，用 line_then_eof：桥发一行
# 后底座替它关 stdin。status 的退出码 0 = 已登录，登录网页列表显示用。
[[login]]
id = "chatgpt"
name = "ChatGPT 账号（设备码）"
command = ["/data/agent/tools/codex-acp/2.6.0/node_modules/@openai/codex/bin/codex.js", "login", "--device-auth"]
status = ["/data/agent/tools/codex-acp/2.6.0/node_modules/@openai/codex/bin/codex.js", "login", "status"]

[[login]]
id = "api-key"
name = "OpenAI API key"
command = ["/data/agent/tools/codex-acp/2.6.0/node_modules/@openai/codex/bin/codex.js", "login", "--with-api-key"]
stdin = "line_then_eof"
status = ["/data/agent/tools/codex-acp/2.6.0/node_modules/@openai/codex/bin/codex.js", "login", "status"]
