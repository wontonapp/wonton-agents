[acp]
# 适配器打进镜像（Apache-2.0 的开源 npm 包，Dockerfile 按摘要装）：bin 是
# dist/index.js，shebang 走容器里的 node。CODEX_PATH 不设：适配器自己从同目录的
# node_modules 解析 @openai/codex/bin/codex.js 当 CLI（登录和 app-server 都是）。
command = ["/opt/codex-acp/dist/index.js"]

[skills]
target = "~/.agents/skills"

[gateway]
hook = "/usr/local/lib/wonton-agent/gateway"

# Codex 的 config.toml 支持 env_key 引用变量名，key 不落盘；网关接好时底座把它
# 解析出来的值加进 ACP 子进程环境，Codex 的模型请求带着它发给网关。
[gateway.env]
OPENAI_API_KEY = "WONTON_MODEL_API_KEY"

# 登录网页：容器里 0.0.0.0:8080，插件清单声明成 webui（核心网关挡在前面）。
[web]
port = 8080

# 官方账号登录：Codex 自己的程序里完成，链接和设备码由桥发进聊天（容器里没有
# 浏览器）。--with-api-key 读 stdin 到 EOF 才收 key，用 line_then_eof：桥发一行
# 后底座替它关 stdin。status 的退出码 0 = 已登录，登录网页列表显示用。
[[login]]
id = "chatgpt"
name = "ChatGPT 账号（设备码）"
command = ["/opt/codex-acp/node_modules/@openai/codex/bin/codex.js", "login", "--device-auth"]
status = ["/opt/codex-acp/node_modules/@openai/codex/bin/codex.js", "login", "status"]

[[login]]
id = "api-key"
name = "OpenAI API key"
command = ["/opt/codex-acp/node_modules/@openai/codex/bin/codex.js", "login", "--with-api-key"]
stdin = "line_then_eof"
status = ["/opt/codex-acp/node_modules/@openai/codex/bin/codex.js", "login", "status"]
