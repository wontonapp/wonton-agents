[acp]
# 适配器打进镜像（Apache-2.0 的开源 npm 包，Dockerfile 按摘要装）：bin 是
# dist/index.js，shebang 走容器里的 node。CODEX_PATH 不设：适配器自己从同目录的
# node_modules 解析 @openai/codex/bin/codex.js 当 CLI（登录和 app-server 都是）。
command = ["/usr/local/lib/wonton-agent/acp"]

[skills]
target = "~/.agents/skills"

[gateway]
hook = "/usr/local/lib/wonton-agent/gateway"

# Codex 的 config.toml 支持 env_key 引用变量名，key 不落盘；网关接好时底座把它
# 解析出来的值加进 ACP 子进程环境，Codex 的模型请求带着它发给网关。
[gateway.env]
OPENAI_API_KEY = "WONTON_MODEL_API_KEY"

# 登录网页：容器里 0.0.0.0:8080，插件清单声明成 webui（核心网关挡在前面）。
[web]
port = 8080

# 仅在主人选择且设备码登录成功后，底座才记为官方订阅模式。
[[login]]
id = "chatgpt"
name = "ChatGPT 账号（设备码）"
model_source = "official"
command = ["/opt/codex-acp/node_modules/@openai/codex/bin/codex.js", "-c", 'forced_login_method="chatgpt"', "login", "--device-auth"]
status = ["/usr/local/lib/wonton-agent/auth-status"]

[[login]]
id = "magpie"
name = "magpie 模型网关"
model_source = "gateway"
