# 本文件由 gen/gen.py 从 agent.yaml 和 template/ 生成：改 agent.yaml 后重新生成，不要手改。
# bridge 说 ACP、不认识任何一家 Agent；两个服务共享 ACP socket 所在的 run/ 子目录和工作区（bridge 把主人发来的
# 图片和文件落到工作区的 wonton-attachments/ 下，再把路径交给 Agent）。bridge 的 crypto store 和 Matrix 令牌不给
# agent，agent 的 HOME 不给 bridge。
services:
  agent:
    image: ghcr.io/wontonapp/wonton-agents/opencode:0.1.2
    # 底座镜像固定用 65532，入口不再降权；bridge 挂同一个 run/ 目录，两个服务的属主必须相同。
    user: "65532:65532"
    restart: unless-stopped
    environment:
      HOME: /data/agent/home
      # 底座每次启动按有没有值选路：三个 WONTON_MODEL_* 都有值时调网关钩子，任一为空就清掉
      # 网关配置、用 Agent 自己的登录态。这里不写代理变量，写了空值会把核心注入的顶掉。
      WONTON_MODEL_BASE_URL: ${WONTON_MODEL_BASE_URL:-}
      WONTON_MODEL_API_KEY: ${WONTON_MODEL_API_KEY:-}
      WONTON_MODEL_DEFAULT: ${WONTON_MODEL_DEFAULT:-}
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      # 容器里没有浏览器：登录命令只打链接，用户自己开浏览器拿 code。
      NO_BROWSER: "1"
    volumes:
      - ${WONTON_BOT_DATA:?需要 Bot 数据目录}/agent:/data/agent
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      # socket 是就绪的标志（首启下载 CLI 可能要几分钟）：有它才算能接连接。
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      start_interval: 2s

  bridge:
    # 桥镜像的版本和摘要只写这一处；桥升级改这里，再重新生成所有子目录。
    image: ghcr.io/wontonapp/wonton-acp-bridge:main-c69aebc@sha256:ce235c94454fdad3fbac729db5d21a8bcdec88688f43e6cd9aebe9efbac2c85d
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_started
    environment:
      HOME: /data/bridge
      WONTON_BOT_DATA: /data
      WONTON_BRIDGE_DATA: /data/bridge
      WONTON_ACP_SOCKET: /data/run/acp.sock
      WONTON_AGENT_WORKSPACE: /workspace
      WONTON_MATRIX_HOMESERVER: ${WONTON_MATRIX_HOMESERVER:?需要 Matrix 地址}
      WONTON_MATRIX_ACCESS_TOKEN: ${WONTON_MATRIX_ACCESS_TOKEN:?需要 Bot 的 Matrix 访问令牌}
      # 名单变量 0.9 起改叫 WONTON_MATRIX_ALLOWED_USERS；两个名字都传，新旧桥都能读。
      WONTON_MATRIX_ALLOWED_USERS: ${WONTON_MATRIX_ALLOWED_USERS:-${WONTON_MATRIX_OWNER:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_OWNER: ${WONTON_MATRIX_OWNER:-${WONTON_MATRIX_ALLOWED_USERS:?需要主人的 Matrix 用户 ID}}
      WONTON_MATRIX_HOME_ROOM: ${WONTON_MATRIX_HOME_ROOM:?需要主人与 Bot 的主房间}
      WONTON_MCP_URL: ${WONTON_MCP_URL:?需要 MCP 总线地址}
      # 主会话的 ACP 模式；话题会话要更严的「改前先问」模式时，在 agent.yaml 配 acp_topic_mode。
      WONTON_ACP_MODE: plan
    volumes:
      - ${WONTON_BOT_DATA}/bridge:/data/bridge
      - ${WONTON_BOT_DATA}/run:/data/run
      - ${WONTON_BOT_DATA}/workspace:/workspace
    healthcheck:
      test: ["CMD", "test", "-S", "/data/run/acp.sock"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
  # 登录网页的入口：webui 不能指向 Bot 服务（旧核心仍按这条判），而登录页在 agent 容器里（每个 Bot 一份），
  # 所以架一个全插件一份的转发。插件页只开默认 Bot 的那一份，聊天里的 /wonton login 用当前 Bot。
  web:
    image: ghcr.io/wontonapp/wonton-agents/opencode:0.1.2
    user: "65532:65532"
    restart: unless-stopped
    entrypoint: ["python3", "/usr/local/lib/wonton-agent/web-proxy"]
    environment:
      HOME: /data/agent/home
      WEB_PORT: "8080"
    healthcheck:
      # 本地监听和上游都要通：上游没了这台也不该算健康。
      test: ["CMD", "python3", "-c", "import socket; [socket.create_connection(a, 3).close() for a in [('127.0.0.1', 8080), ('agent-default', 8080)]]"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

x-wonton:
  spec: "0.6"
  id: ai.opencode
  version: 0.1.2
  kind: agent
  title: { zh: AI 编程助手（OpenCode）, en: Coding Bot (OpenCode) }
  description:
    zh: 开源、不绑定哪一家的编程助手：读代码、改文件、跑命令，改动前先弹卡片问你。直接用模型设置就行，也能用 OpenCode 自家的模型服务。
    en: "An open-source coding bot not tied to any one AI company: it reads code, edits files and runs commands, always asking with a card before changes. Works with your Models setup, or OpenCode's own model service."
  icon: icon.svg
  notices: [NOTICE]
  author: { name: Wonton plugin authors }
  homepage: https://github.com/wontonapp/wonton-agents
  license: MIT
  tags: { zh: [AI, 工具], en: [AI, Tools] }
  about:
    zh: |
      OpenCode 是开源的编程 AI。装好后用它的官方程序干活（第一次启动时自动下载，稍等一下）；默认用模型
      设置里配好的 AI（配好后自动接上，不用登录）；想用 OpenCode 自家的模型服务，在聊天里发 /wonton
      login，或在登录网页里贴上自己的 OpenCode key。主聊天和任务聊天里改文件、跑命令之前都会先弹
      确认卡片问你。

      模型默认走云吞的模型网关（网关就绪后自动接上，不需要登录）；想用 OpenCode 自己的模型服务时，
      在聊天里发 /wonton login，或在插件的登录网页里粘贴 OpenCode 的 API key。

      OpenCode 会改文件、跑命令：主会话默认在 plan 模式（只读，改文件被拒），话题会话在 build 模式，
      改文件和跑命令都会先弹确认卡片。
    en: |
      OpenCode is an open-source coding AI. It runs the official program (downloaded automatically on
      first start, so give it a moment); by default it uses the AI set up in Models (connected
      automatically once ready, no sign-in). To use OpenCode's own model service, send /wonton login
      in the chat or paste your OpenCode key on the sign-in page. In both the main chat and task
      chats it sends an approval request before editing files or running commands.

      Models go through the Wonton model gateway by default (connected automatically once the gateway is
      ready, no login needed); to use OpenCode's own model service instead, send /wonton login in chat or
      paste your OpenCode API key on the plugin's login page.

      OpenCode edits files and runs commands: the main session runs in plan mode and topic sessions
      follow it, so edits and commands always ask first via confirmation cards.
  release_notes:
    zh: AI 正忙时你接着发的消息会直接递给它，不用等这一轮做完；能收图片和文件。
    en: Messages you send while the AI is busy now reach it right away instead of waiting for the turn to end; it can take images and files.
  webui:
    service: web
    port: 8080
    sso: none
  agent:
    protocol: acp
    login:
      - id: opencode
        title: { zh: OpenCode 账号（粘贴 API key）, en: OpenCode account (paste API key) }
  bot:
    display_name: { zh: AI 编程助手（OpenCode）, en: Coding Bot (OpenCode) }
  bots:
    services: [agent, bridge]
  permissions:
    - matrix.bot
    - tools
    - models
    # 登录和官方模型请求都要出网；底座首启下载闭源 CLI 也走这里。
    - network.egress
  requirements:
    arch: [amd64, arm64]
    memory: 512M
