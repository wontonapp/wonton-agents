id: ai.opencode
version: 0.1.3
title: { zh: AI 编程助手（OpenCode）, en: Coding Bot (OpenCode) }
description:
  zh: 开源的编程助手：通过 magpie 模型网关读代码、改文件、跑命令，改动前先弹卡片问你。
  en: "An open-source coding bot: uses the magpie model gateway to read code, edit files and run commands, asking with a card before changes."
about:
  zh: |
    OpenCode 是开源的编程 AI。装好后用它的官方程序干活（第一次启动时自动下载，稍等一下）；
    主模型和辅助模型统一通过 magpie 模型网关，不用在插件里登录或填 key。
    网关未就绪时明确报错，不会改用官方免费模型、已保存的账号或其他服务。

    OpenCode 会改文件、跑命令：主会话和话题会话默认都在 plan 模式，
    改文件和跑命令都会先弹确认卡片。
  en: |
    OpenCode is an open-source coding AI. It runs the official program, downloaded automatically on
    first start. Primary and helper models use the magpie model gateway only, with no plugin login or
    key entry. An unavailable gateway produces an explicit error instead of switching to official
    free models, saved accounts or another service.

    OpenCode edits files and runs commands: the main session runs in plan mode and topic sessions
    follow it, so edits and commands always ask first via confirmation cards.
release_notes:
  zh: 主模型和辅助模型统一走 magpie，移除 API key 登录并限制服务商选择；网关未就绪时明确报错，不再回退免费模型。
  en: Primary and helper models now use magpie only. API-key login is removed and provider selection is restricted; an unavailable gateway reports an error instead of falling back to free models.
  zh-Hant: 主模型和輔助模型統一走 magpie，移除 API key 登入並限制服務商選擇；網關未就緒時明確報錯，不再退回免費模型。
  ja: メインと補助モデルを magpie に統一し、API キーでのログインを削除して接続先を制限しました。ゲートウェイが未準備の場合はエラーを表示し、無料モデルに切り替えません。
