name: 注册表版本

# 每天读一次 ACP 注册表；某家的新版本进了注册表，就改这家的 agent.toml 并提 PR。手动触发默认只演练、不推分支。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 只打印改动，不推分支、不开 PR
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 找新版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$DRY_RUN" == true ]]; then
            python3 .github/registry_bot.py --dry-run
          else
            python3 .github/registry_bot.py
          fi
