name: 发布

# 推 tag 触发：插件是 `<id>/v<版本>`，底座是 `base/v<版本>`。多架构镜像在 GitHub 托管的机器上构建、用
# GITHUB_TOKEN 推到 ghcr.io，不登录别的镜像仓库；推完把摘要写进 compose（底座写进 base/DIGEST）提交，
# 再把 tag 移到这个提交上——发布过的 tag 只在这一步移动，之后不再动。这个提交只挂在 tag 上，不推回 main
# （见 scripts/publish.sh 开头）。
on:
  push:
    tags: ['*/v*']

permissions:
  contents: write
  packages: write

concurrency:
  # 一次只发一个，tag 的移动按推送顺序。
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.tag.outputs.kind }}
      id: ${{ steps.tag.outputs.id }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python3 .github/tag.py "$REF_NAME"

  base:
    needs: plan
    if: needs.plan.outputs.kind == 'base'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 文件和函数长度检查
        run: python3 base/scripts/check-size.py
      - name: 测试
        run: python3 -m unittest discover -s base/tests -v
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          meta="$RUNNER_TEMP/meta.json"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --tag "ghcr.io/wontonapp/wonton-agent-base:${VERSION}" \
            --metadata-file "$meta" \
            --push base
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$meta")"
          printf '%s\n' "$digest" > base/DIGEST
          echo "已推送 ghcr.io/wontonapp/wonton-agent-base:${VERSION}@$digest"
      - name: 提交摘要并把 tag 移过去
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base/DIGEST
          git diff --cached --quiet || git commit -m "chore(release): $TAG 的镜像按摘要固定"
          git tag -f -a "$TAG" -m "$TAG"
          git push --force origin "$TAG"

  agent:
    needs: plan
    if: needs.plan.outputs.kind == 'agent'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 发布
        env:
          WONTON_PLUGIN: agents/${{ needs.plan.outputs.id }}
          TAG_PUSHED: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/publish.sh --official
